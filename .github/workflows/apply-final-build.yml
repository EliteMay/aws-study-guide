name: Apply final beginner redesign

on:
  push:
    branches:
      - improve/learning-experience-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate final site
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/apply/part* > /tmp/aws_final.b64
          base64 -d /tmp/aws_final.b64 > /tmp/aws_final.tgz
          echo "c55294e3bf962a34d35b52433c4ecb115872b5f756fdf66bb7e55c8ff098586c  /tmp/aws_final.tgz" | sha256sum -c -
          tar -xzf /tmp/aws_final.tgz -C .
          rm -f css/styles.css data/aws-core.json
          rm -rf .tmp/apply
          rm -f .github/workflows/apply-final-build.yml
          node --check js/app.js
          node --check js/views.js
          node tests/validate.mjs

      - name: Commit final site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign AWS study guide for complete beginners"
          git push origin HEAD:improve/learning-experience-v2
